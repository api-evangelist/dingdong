name: Dingdong
description: 'Dingdong (Dingdong Maicai / 叮咚买菜) is a Shanghai-based on-demand fresh-grocery e-commerce
  company operating a front-warehouse (dark-store) model that delivers fruit, vegetables, meat, seafood
  and prepared foods to consumers, typically within about 30 minutes, through its mobile app. The company
  is publicly listed on the New York Stock Exchange (ticker DDL) and is backed by Hongshan (formerly
  Sequoia Capital China). Its public surface (ddxq.mobi) is a consumer mobile-app backend rather than a
  developer platform; no public developer portal, API documentation, or open API program was found during
  enrichment, and the host is not reachable outside of China.'
